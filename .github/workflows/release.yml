name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, or empty to bump the patch number"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pick version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          CURRENT=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          VERSION="${INPUT#v}"
          if [[ -z "$VERSION" ]]; then
            VERSION="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got $INPUT"
            exit 1
          fi
          # gh arriba release proposes 1.0.0 until a GitHub release exists, so refuse to go backwards.
          if [[ "$VERSION" == "$CURRENT" || "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "::error::Version $VERSION is not newer than $CURRENT"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update marketplace.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.metadata.version = $v | .plugins[].version = $v' \
            .claude-plugin/marketplace.json > marketplace.tmp
          mv marketplace.tmp .claude-plugin/marketplace.json

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "Bump version $VERSION."
          git tag "$VERSION"
          git push origin "HEAD:$BRANCH"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --generate-notes
